[project]
name = "taskchampion-mcp"
version = "1.0.4"
description = "Model Context Protocol server for Taskwarrior 3.x, TaskChampion, and Timewarrior"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "gabiup2" },
]
keywords = ["mcp", "taskwarrior", "taskchampion", "timewarrior", "llm", "model-context-protocol"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.8.0",
    "tomli>=2.0.0;python_version<'3.11'",
]

[project.urls]
Homepage = "https://github.com/GabiUp2/TaskChampion_MCP"
Repository = "https://github.com/GabiUp2/TaskChampion_MCP"
Documentation = "https://github.com/GabiUp2/TaskChampion_MCP/tree/main/docs"
Changelog = "https://github.com/GabiUp2/TaskChampion_MCP/blob/main/CHANGELOG.md"
"Release Notes" = "https://github.com/GabiUp2/TaskChampion_MCP/blob/main/docs/releases/v1.0.4.md"
"Bug Tracker" = "https://github.com/GabiUp2/TaskChampion_MCP/issues"

[project.scripts]
# Friendly marketplace-facing alias — what README, target install guides, and
# marketplace submission templates tell users to run. Resolves to the same
# main() as the explicit server binary so `uvx taskchampion-mcp` works.
taskchampion-mcp = "taskchampion_mcp.server:main"
# Explicit binary name retained for backward compatibility and for users who
# prefer the executable's role to be obvious from its name.
taskchampion-mcp-server = "taskchampion_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Schemas live inside the package (src/taskchampion_mcp/schemas/) as of v1.0.0,
# so hatchling picks them up automatically when packaging
# src/taskchampion_mcp. Pre-v1.0 they were at the repo root and the wheel
# shipped without them — that broke every clean PyPI install. The relocation
# is the load-bearing fix; this section just needs to point at the package.
packages = ["src/taskchampion_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "LICENSE",
    "NOTICE",
    "README.md",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "integration: tests that require real external binaries and ephemeral data",
    "security: security regression corpus tests",
    "acceptance: Phase 3 target-agnostic acceptance suite (26 scenarios)",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["taskchampion_mcp"]
