# Reviewed by: gabiup2
# Date: 2026-05-25
#
# Publishes to PyPI and the Official MCP Registry on version tag push.
# Trigger: push a tag like v0.2.0
#
# Required secrets:
#   PYPI_API_TOKEN  — PyPI API token (or use Trusted Publishing)
#
# The MCP Registry publish uses GitHub OIDC for io.github.* namespaces,
# so no extra secret is needed for that step.

name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write  # Required for PyPI Trusted Publishing and MCP Registry OIDC

jobs:
  # ------------------------------------------------------------------
  # 1. Run tests before publishing
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Run linter
        run: uv run ruff check src/ tests/

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  # ------------------------------------------------------------------
  # 2. Build and publish to PyPI
  # ------------------------------------------------------------------
  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/taskchampion-mcp/

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses Trusted Publishing (OIDC) — no API token needed if configured.
        # Fallback: set PYPI_API_TOKEN secret and uncomment below.
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}

  # ------------------------------------------------------------------
  # 3. Publish to Official MCP Registry
  # ------------------------------------------------------------------
  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/download/v1.0.0/mcp-publisher_1.0.0_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Authenticate with MCP Registry (GitHub OIDC)
        run: mcp-publisher authenticate --github

      - name: Publish to MCP Registry
        run: mcp-publisher publish

      - name: Verify publication
        run: |
          echo "Verifying publication..."
          sleep 10
          curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.GabiUp2/taskchampion-mcp" | python3 -m json.tool || echo "Verification pending — may take a few minutes to propagate."
