name: CI

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run linter
        run: uv run ruff check src/ tests/

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

      - name: MCP protocol smoke test
        # Validates the server speaks correct MCP over stdio without a live client.
        # This is the automated gate for the published distribution path (ADR 16).
        # A fake TASKDATA dir is used so the server starts cleanly without real tasks.
        run: |
          mkdir -p /tmp/taskdata-smoke
          TASKDATA=/tmp/taskdata-smoke uv run python tests/smoke_test_mcp.py
