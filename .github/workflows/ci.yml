name: CI

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
        taskwarrior-version: ["3.0"]
    steps:
      - name: Echo matrix values
        run: |
          echo "python=${{ matrix.python-version }}"
          echo "taskwarrior=${{ matrix.taskwarrior-version }}"
